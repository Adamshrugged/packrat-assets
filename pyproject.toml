[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "packrat-assets"
version = "0.2.0"
description = "Desktop library for your purchased game assets, with itch.io sync and an MCP server."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pillow>=10",
    "platformdirs>=4",
    "pystray>=0.19; sys_platform != 'linux'",  # tray icon on Windows and macOS
    "jeepney>=0.8; sys_platform == 'linux'",   # tray icon on Linux (D-Bus)
    "mcp>=2.3",
]

[project.scripts]
packrat = "packrat.__main__:main"

[project.urls]
Homepage = "https://github.com/Adamshrugged/packrat-assets"

[dependency-groups]
dev = ["pytest>=8", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: talks to itch.io; catches itch.io page changes (run with: pytest -m live)"]
addopts = "-m 'not live'"

[tool.hatch.build.targets.wheel]
packages = ["packrat"]
