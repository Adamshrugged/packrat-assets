# Runs the tests on Linux and Windows for every push and pull request. Once a week (and by hand) it also
# checks that itch.io's search, tag and asset pages still parse, since itch.io can change them any time.
name: Tests

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"  # Mondays
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2  # publishes exact version tags only
        with:
          python-version: ${{ matrix.python }}
      - name: bsdtar (for the .rar fallback test; Windows has it as tar.exe)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends libarchive-tools
      - name: Lint
        run: uvx pyflakes packrat tests
      - name: Tests
        run: uv run pytest

  itch-pages:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2  # publishes exact version tags only
      - name: itch.io pages still parse
        run: uv run pytest -m live
